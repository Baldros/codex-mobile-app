plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.codexsshtunnel'
version = '0.1.0'

android {
  namespace "expo.modules.codexsshtunnel"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.github.mwiede:jsch:2.28.2'
}
